# Publishes a release when a version tag like v3.1.0 is pushed. Runs the tests, builds a zip of
# the addon folder alone with the MIT license inside, and creates the GitHub release with that
# version's changelog section as its notes. The same zip is what goes to CurseForge and Wago.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The toc's version must match the tag
        run: |
          version=$(grep '^## Version:' QuestPaceLog/QuestPaceLog.toc | sed 's/^## Version: *//' | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then echo "The toc says $version but the tag is $GITHUB_REF_NAME"; exit 1; fi

      - name: Tests
        run: |
          sudo apt-get install -y luajit python3
          luajit tests/run_tests.lua
          python3 tools/test_export_site.py

      - name: Zip the addon
        run: |
          mkdir -p build
          cp -r QuestPaceLog build/
          cp LICENSE build/QuestPaceLog/LICENSE.txt
          cd build && zip -r "../AdventurersAlmanac-$GITHUB_REF_NAME.zip" QuestPaceLog

      - name: Notes from the changelog
        run: awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = index($0, "## " v ",") == 1; next} p' CHANGELOG.md > notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "AdventurersAlmanac-$GITHUB_REF_NAME.zip" --title "Adventurer's Almanac $GITHUB_REF_NAME" --notes-file notes.md
